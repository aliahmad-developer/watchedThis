<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Badge -->
  <rect width="64" height="64" rx="12" fill="#031926"/>
  <!-- TV Body -->
  <rect x="8" y="14" width="48" height="42" rx="7" fill="#ede9e0"/>
  <!-- Screen -->
  <rect x="13" y="19" width="38" height="26" rx="4" fill="#0c1e2c"/>
  <!-- Left eye -->
  <rect x="17" y="25" width="8" height="7" rx="1.5" fill="#468189"/>
  <rect x="21" y="27" width="3" height="3" rx="1" fill="rgba(3,25,38,0.7)"/>
  <!-- Right eye: half-lidded -->
  <rect x="30" y="25" width="8" height="7" rx="1.5" fill="#468189"/>
  <rect x="30" y="25" width="8" height="3.5" rx="1.5" fill="#0c1e2c"/>
  <!-- Smirk -->
  <path d="M 18,38 Q 32,44 46,38" fill="none" stroke="#468189" stroke-width="2" stroke-linecap="round"/>
  <!-- Teal band -->
  <rect x="8" y="44" width="48" height="3" fill="#468189" opacity="0.5"/>
  <!-- Knobs -->
  <circle cx="17" cy="52" r="4" fill="#cdc5b8"/>
  <circle cx="47" cy="52" r="4" fill="#cdc5b8"/>
  <!-- Left antenna -->
  <line x1="18" y1="14" x2="9" y2="4" stroke="#ede9e0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="8" cy="3" r="3" fill="#468189"/>
  <!-- Right antenna -->
  <line x1="46" y1="14" x2="55" y2="4" stroke="#ede9e0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="56" cy="3" r="4" fill="#ede9e0"/>
  <circle cx="56" cy="3" r="2.5" fill="#468189"/>
</svg>
