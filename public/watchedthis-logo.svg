<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">



  <!-- TV Body -->
  <rect x="46" y="48" width="94" height="92" rx="14" fill="#ede9e0"/>
  <rect x="50" y="136" width="86" height="3" rx="2" fill="rgba(3,25,38,0.12)"/>

  <!-- Screen -->
  <rect x="57" y="57" width="72" height="54" rx="7" fill="#0c1e2c"/>
  <rect x="60" y="59" width="24" height="6" rx="2" fill="rgba(255,255,255,0.04)"/>

  <!-- Left eye -->
  <rect x="66" y="70" width="16" height="13" rx="2.5" fill="#468189"/>
  <rect x="76" y="73" width="4" height="6" rx="1" fill="rgba(3,25,38,0.75)"/>
  <rect x="67" y="71" width="4" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>

  <!-- Right eye: half-lidded -->
  <rect x="96" y="70" width="16" height="13" rx="2.5" fill="#468189"/>
  <rect x="96" y="70" width="16" height="7" rx="2.5" fill="#0c1e2c"/>
  <rect x="98" y="76" width="4" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>

  <!-- Smirk -->
  <path d="M 69,102 Q 91,114 113,102" fill="none" stroke="#468189" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Teal accent band -->
  <rect x="46" y="122" width="94" height="4" rx="1" fill="#468189" opacity="0.45"/>

  <!-- Knobs -->
  <circle cx="70" cy="133" r="7.5" fill="#cdc5b8"/>
  <circle cx="116" cy="133" r="7.5" fill="#cdc5b8"/>
  <circle cx="68" cy="131" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <circle cx="114" cy="131" r="2.5" fill="rgba(255,255,255,0.45)"/>

  <!-- Legs -->
  <rect x="58" y="142" width="16" height="16" rx="5" fill="#d4ccbf"/>
  <rect x="112" y="142" width="16" height="16" rx="5" fill="#d4ccbf"/>

  <!-- Left antenna -->
  <line x1="67" y1="48" x2="46" y2="20" stroke="#8693ab" stroke-width="3" stroke-linecap="round"/>
  <circle cx="44" cy="17" r="7" fill="#468189"/>
  <circle cx="44" cy="17" r="3" fill="#031926"/>

  <!-- Right antenna -->
  <line x1="118" y1="48" x2="136" y2="21" stroke="#8693ab" stroke-width="3" stroke-linecap="round"/>
  <circle cx="137" cy="19" r="9" fill="#8693ab"/>
  <circle cx="137" cy="19" r="5" fill="#468189"/>
  <circle cx="137" cy="19" r="2" fill="#031926"/>

  <!-- Divider line -->
  <line x1="188" y1="28" x2="188" y2="172" stroke="#1a3a4a" stroke-width="1.2"/>

  <!-- Wordmark: WatchedThis with capitalized W and T -->
  <text font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" dominant-baseline="middle">
    <tspan x="206" y="90" font-size="64" font-weight="700" fill="#eef0f2">W</tspan><tspan font-size="60" font-weight="500" fill="#eef0f2">atched</tspan><tspan font-size="64" font-weight="700" fill="#468189">T</tspan><tspan font-size="60" font-weight="400" fill="#468189">his</tspan>
  </text>

  <!-- Tagline -->
  <text x="210" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#637074" letter-spacing="3.5">SPIN · DISCOVER · TRACK</text>

  <!-- Tagline underline -->
  <rect x="210" y="156" width="44" height="2" rx="1" fill="#468189" opacity="0.5"/>

</svg>
