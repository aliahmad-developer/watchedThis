runConfig:
  cpu: 2
  memoryMiB: 512
  timeoutSeconds: 60
  concurrency: 80

env:
  - variable: TMDB_ACCESS_TOKEN
    secret: TMDB_ACCESS_TOKEN
  - variable: TMDB_API_KEY
    secret: TMDB_API_KEY
  - variable: TMDB_BASE_URL
    secret: TMDB_BASE_URL
  - variable: ADMIN_PROJECT_ID
    secret: ADMIN_PROJECT_ID
  - variable: ADMIN_CLIENT_EMAIL
    secret: ADMIN_CLIENT_EMAIL
  - variable: ADMIN_PRIVATE_KEY
    secret: ADMIN_PRIVATE_KEY
  - variable: FIREBASE_SERVICE_ACCOUNT
    secret: FIREBASE_SERVICE_ACCOUNT
  - variable: NEXT_PUBLIC_BASE_URL
    secret: NEXT_PUBLIC_BASE_URL
  - variable: NEXT_PUBLIC_FIREBASE_API
    secret: NEXT_PUBLIC_FIREBASE_API
  - variable: NEXT_PUBLIC_AUTH_DOMAIN
    secret: NEXT_PUBLIC_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_PROJECT_ID
    secret: NEXT_PUBLIC_PROJECT_ID
  - variable: NEXT_PUBLIC_STORAGE_BUCKET
    secret: NEXT_PUBLIC_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_APP_ID
    secret: NEXT_PUBLIC_APP_ID
  - variable: NEXT_PUBLIC_APP_URL
    secret: NEXT_PUBLIC_APP_URL
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: EMAIL_FROM
    secret: EMAIL_FROM
  - variable: RANDOM_HMAC_SECRET
    secret: RANDOM_HMAC_SECRET
  - variable: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    secret: NEXT_PUBLIC_GOOGLE_CLIENT_ID